name: 提交资料或学习经验 (网页预填)
description: 已在网站选好课程与页面时使用; 从仓库直接投稿请选择同名的普通表单
title: '[资料] '
body:
- type: markdown
  attributes:
    value: '**这是公开投稿, 提交后文字、附件和 GitHub 账号立即公开**。只提供你有权公开的内容, 不上传群聊、成绩、私人联系方式或权限不明的原件。

      网页可以匿名, 这里的 GitHub 记录仍公开。暂不能公开时, 先只写材料名称或线索, 与维护者确认合适的非公开渠道。

      涉及撤回或隐私时, 只写页面位置与处理请求, 不附敏感证据。不清楚的项目可以留空。

      '
- type: input
  id: course
  attributes:
    label: 课程
    description: 从网站进入时会自动填写, 无需重复选择。直接投稿可填写课程名称与代码; 已填页面地址时也可保留“按页面地址自动匹配”
    value: 按页面地址自动匹配
  validations:
    required: true
- type: input
  id: page
  attributes:
    label: 页面地址
    description: 从网页进入时会自动填写; 没有对应页面可以留空
- type: input
  id: period
  attributes:
    label: 适用范围
    placeholder: 学年、学期、年级或班型, 只写能确认的部分
- type: textarea
  id: content
  attributes:
    label: 内容
    description: 提供新的资料或学习经验; 可以直接写文字、拖入可公开附件或提供公开链接
    placeholder: 这是什么资料或经验？适合谁参考？哪些地方还不完整或不确定？
  validations:
    required: true
- type: textarea
  id: source
  attributes:
    label: 来源与依据
    placeholder: 自己的经历或回忆 / 原作者与公开链接 / 文件名与页码; 不清楚请说明
- type: input
  id: credit
  attributes:
    label: 网页署名
    description: 选填, 只写愿意公开的署名或“网页匿名”; GitHub 投稿记录仍公开, 代传材料请区分原作者与提供者
- type: dropdown
  id: use_scope
  attributes:
    label: 本站使用范围
    options:
    - 仅提供线索, 暂不授权整理
    - 允许整理文字并在本站展示, 附件仅作核对
    - 允许整理文字及原附件在本站展示
    default: 0
  validations:
    required: true
- type: dropdown
  id: model_service
  attributes:
    label: 允许使用的外部模型服务
    description: 默认人工处理, 不影响投稿。选定服务仅表示材料使用同意; 仍需维护者审核这一版材料后才会调用, 不自动读取附件。服务与用途见 https://bms-zju.github.io/BMS_Database/contribute/#ai
    options:
    - 仅人工处理
    - DeepSeek
    - OpenAI
    - Gemini
    default: 0
  validations:
    required: true
- type: dropdown
  id: ginkgo
  attributes:
    label: Ginkgo 使用意愿
    description: Ginkgo 是独立的免费在线练习网站, 可将材料整理为选择题练习或问答卡片。默认未同意, 不影响本站投稿; 与本站收录和外部模型处理分别确认。说明见 https://bms-zju.github.io/BMS_Database/contribute/#ginkgo
    options:
    - 未同意或尚未确认
    - 同意将本次允许公开的内容用于 Ginkgo 免费练习, 保留来源并区分新增内容
    default: 0
- type: checkboxes
  id: public_confirmation
  attributes:
    label: 公开确认
    options:
    - label: 我确认本次填写的文字和附件可以立即公开, 并有权提供这些内容
      required: true
