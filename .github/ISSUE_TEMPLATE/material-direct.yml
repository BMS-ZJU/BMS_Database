    description: Ginkgo 是独立的免费在线练习网站, 可将材料整理为选择题练习或问答卡片。默认未同意, 不影响本站投稿; 与本站收录和外部模型处理分别确认。说明见 https://bms-zju.github.io/BMS_Database/contribute/#ginkgo
    options:
