{% if page.meta.contribution_links %}
<details class="contribution-actions">
  <summary>完善本页</summary>
  <nav aria-label="参与完善本页">
    <a href="{{ page.meta.contribution_links.material | e }}">补充资料或经验</a>
    <a href="{{ page.meta.contribution_links.correction | e }}">纠错或补充本页</a>
    {% if page.edit_url %}
    <a href="{{ page.edit_url | e }}">直接编辑本页</a>
    {% endif %}
  </nav>
</details>
{% endif %}
