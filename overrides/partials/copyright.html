{# Keep copyright, resource-use terms and theme attribution readable at narrow widths. #}
<div class="md-copyright bms-footer-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">{{ config.copyright }}</div>
  {% endif %}
  <div class="bms-footer-fineprint">
    <span class="resource-use-footer">资料免费获取 · <a href="{{ 'contribute/sources-and-permissions/' | url }}#resource-use">使用限制</a></span>
    {% if not config.extra.generator == false %}
      <span class="bms-footer-attribution">Made with <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a></span>
    {% endif %}
  </div>
</div>
