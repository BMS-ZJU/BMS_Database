{% if page.meta.comments != false %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <script src="https://giscus.app/client.js"
          data-repo="BMS-ZJU/BMS_Database"
          data-repo-id="R_kgDOOe-BqA"
          data-category="General"
          data-category-id="DIC_kwDOOe-BqM4CpsoM"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="{{ config.site_url }}css/giscus-light.css"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    (() => {
      const syncTheme = () => {
        let scheme = document.body.dataset.mdColorScheme
        if (!document.body.hasAttribute("data-md-color-media")) {
          const initial = Array.from(document.querySelectorAll("[data-md-component=palette] input"))
            .find(input => input.dataset.mdColorMedia && matchMedia(input.dataset.mdColorMedia).matches)
          if (initial) scheme = initial.dataset.mdColorScheme
        }
        const themeFile = scheme === "slate"
          ? "giscus-dark.css"
          : "giscus-light.css"
        const theme = new URL("{{ 'css/' | url }}" + themeFile, document.baseURI).href
        const giscus = document.querySelector('script[src="https://giscus.app/client.js"]')
        if (giscus) giscus.setAttribute("data-theme", theme)

        const frame = document.querySelector(".giscus-frame")
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme } } },
            "https://giscus.app"
          )
        }
      }

      const bindPalette = () => {
        const ref = document.querySelector("[data-md-component=palette]")
        if (ref && !ref.hasAttribute("data-giscus-theme-bound")) {
          ref.setAttribute("data-giscus-theme-bound", "")
          ref.addEventListener("change", syncTheme)
        }
        syncTheme()
      }

      syncTheme()
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindPalette, { once: true })
      } else {
        bindPalette()
      }
    })()
  </script>
{% endif %}
