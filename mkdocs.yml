  !zijingang/assets/textbook-return-route.webp
  !zijingang/assets/textbook-return-entrance.jpg
  !zijingang/assets/textbook-return-entrance.webp
  !zijingang/assets/textbook-return-office.png
  !zijingang/assets/textbook-return-office.webp

validation:
  nav:
    omitted_files: warn

theme:
  name: material
  language: zh
  logo: assets/brand/zjubms-folded-header.svg
  favicon: assets/brand/zjubms-folded-transparent-512.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - content.action.edit

  custom_dir: overrides

