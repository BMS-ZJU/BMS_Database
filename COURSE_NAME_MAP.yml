# course_code 由 2020—2026 级基础医学培养方案核对，用于排除同名课程。
# path 是仓库 docs/ 下的现有相对目录，不随英文名自动改名；
# 尚未建立课程页面的课程统一放在 curriculum_only_courses，path 为 null。
